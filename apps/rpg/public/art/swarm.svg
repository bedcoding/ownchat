<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 버그떼가 달려들고 주석 두 획이 앞줄을 쓸어버리는 장면. -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#c9e37a" stop-opacity="0"/>
      <stop offset="45%" stop-color="#d8f08c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c9e37a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#0d0d0f"/>

  <!-- 스택 트레이스 배경 -->
  <g fill="#7a2a22" font-family="monospace" font-size="6.5" opacity="0.5">
    <text x="14" y="24">at parse (index.js:412)</text>
    <text x="14" y="38">at render (view.js:88)</text>
    <text x="14" y="52">Cannot read property of undefined</text>
    <text x="14" y="272">at loop (legacy.js:1)</text>
    <text x="14" y="286">Cannot read property of undefined</text>
  </g>

  <!-- 죽어 회색이 된 앞줄 -->
  <g fill="#33353c" opacity="0.9">
    <path d="M118 96 l16 -9 16 9 v18 l-16 9 -16 -9 z"/>
    <path d="M116 150 l15 -9 15 9 v17 l-15 9 -15 -9 z"/>
    <path d="M122 202 l14 -8 14 8 v16 l-14 8 -14 -8 z"/>
  </g>

  <!-- 아직 살아 있는 버그떼 -->
  <g fill="#8c2f24" stroke="#e0704f" stroke-width="1.3">
    <path d="M228 74 l18 -10 18 10 v20 l-18 10 -18 -10 z"/>
    <path d="M292 112 l16 -9 16 9 v18 l-16 9 -16 -9 z"/>
    <path d="M240 168 l17 -10 17 10 v19 l-17 10 -17 -10 z"/>
    <path d="M310 206 l15 -8 15 8 v17 l-15 9 -15 -9 z"/>
    <path d="M356 148 l13 -8 13 8 v15 l-13 8 -13 -8 z"/>
  </g>
  <g fill="#e0704f" opacity="0.85">
    <circle cx="243" cy="82" r="2"/><circle cx="251" cy="82" r="2"/>
    <circle cx="305" cy="120" r="1.8"/><circle cx="312" cy="120" r="1.8"/>
    <circle cx="253" cy="177" r="1.8"/><circle cx="261" cy="177" r="1.8"/>
  </g>

  <!-- 주석 두 획 -->
  <rect x="60" y="20" width="300" height="260" fill="url(#sweep)" opacity="0.16"
        transform="rotate(-14 200 150)"/>
  <g stroke="#e8ffa8" stroke-width="7" stroke-linecap="round">
    <path d="M170 226 L206 66" opacity="0.95"/>
    <path d="M204 232 L240 72" opacity="0.95"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M170 226 L206 66"/>
    <path d="M204 232 L240 72"/>
  </g>
</svg>
